<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>团队工作台</title><style>body{font:16px system-ui;background:#f4f6fa;color:#203044;max-width:1000px;margin:40px auto;padding:0 20px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,textarea,select,button{font:inherit;padding:10px;margin:5px;max-width:95%;box-sizing:border-box}textarea{display:block;width:95%;min-height:110px}button{background:#244d86;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#54667b}</style><h1>团队工作台</h1><small>工作记录 → 事项状态 → 有证据的回答 · 本地试用版</small><section><input id="token" type="password" placeholder="个人访问令牌"><button id="login">登录</button><select id="projects"></select><input id="projectName" placeholder="新项目名"><button id="create">新建项目</button></section><section><h2>记录进展与问题</h2><textarea id="text" placeholder="今天完成了什么、遇到什么问题、谁在跟进……"></textarea><label>发生时间 <input id="occurred" type="datetime-local"></label><button id="extract">提取事项草稿</button><small>先查看、修改事项草稿，再保存。留空事项列表可只保存原始记录。</small><div id="draft"></div><button id="addItem">添加事项</button><pre id="ambiguities"></pre><button id="save">确认保存</button></section><section><h2>当前事项</h2><div id="items"></div><pre id="timeline"></pre><h2>原始工作记录</h2><div id="records"></div></section><section><h2>提问 / 生成周报</h2><textarea id="question" placeholder="这个项目现在卡在哪里？本周有哪些进展？"></textarea><button id="ask">查询</button><pre id="answer"></pre><div id="citations"></div><div id="clarify" hidden><h3 id="clarifyQuestion"></h3><p id="clarifyReason"></p><div id="clarifyOptions"></div><input id="clarifyReply" aria-label="补充说明" placeholder="也可以直接补充说明"><button id="reply">继续回答</button><button id="cancelClarify">重新提问</button></div></section><p id="status" role="status"></p><script type="module">
const $=id=>document.getElementById(id);let accessToken='',key=crypto.randomUUID(),pendingClarification=null,queryBusy=false;
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
let changes=[];function renderDraft(){const root=$('draft');root.replaceChildren();changes.forEach((c,i)=>{const row=document.createElement('div');const title=document.createElement('input');title.placeholder='事项名称';title.value=c.title??'';title.oninput=()=>c.title=title.value;const status=document.createElement('select');for(const [value,label] of [['open','进行中'],['blocked','受阻'],['done','已完成'],['cancelled','已取消']])status.add(new Option(label,value));status.value=c.status??'open';status.onchange=()=>c.status=status.value;const owner=document.createElement('input');owner.placeholder='跟进人';owner.value=c.owner??'';owner.oninput=()=>c.owner=owner.value;const remove=document.createElement('button');remove.textContent='移除';remove.onclick=()=>{changes.splice(i,1);renderDraft();};const note=document.createElement('small');note.textContent=(c.item_id?'更新已有事项':'新事项')+' · '+(c.kind==='inferred'?'系统推断':'记录陈述');row.append(title,status,owner,note,remove);root.append(row);});} $('addItem').onclick=()=>{changes.push({title:'',status:'open',kind:'reported'});renderDraft();};
const project=()=>{if(!$('projects').value)throw Error('请先选择项目');return 'projects/'+$('projects').value;};
async function refresh(){const [items,records]=await Promise.all([api(project()+'/items'),api(project()+'/records')]);$('items').replaceChildren();for(const item of items){const row=document.createElement('p');const label={open:'进行中',blocked:'受阻',done:'已完成',cancelled:'已取消'};row.textContent=item.title+' · '+label[item.status]+' · 跟进人：'+(item.owner??'未指定')+' · '+(item.kind==='inferred'?'系统推断':'记录陈述')+' · 更新于 '+new Date(item.occurred_at).toLocaleString();const history=document.createElement('button');history.textContent='查看历史';history.onclick=run(async()=>{const list=await api(project()+'/timeline?item='+encodeURIComponent(item.id));$('timeline').textContent=list.map(e=>new Date(e.occurred_at).toLocaleString()+' · '+label[e.status]+'\n'+e.text).join('\n\n');});const update=document.createElement('button');update.textContent='更新状态';update.onclick=()=>{changes.push({item_id:item.id,title:item.title,status:item.status,owner:item.owner,kind:'reported'});renderDraft();};row.append(history,update);$('items').append(row);}$('records').replaceChildren();for(const r of records){const el=document.createElement('pre');el.id='record-'+r.id;el.textContent=r.author+' · '+r.occurred_at+'\n'+r.text;$('records').append(el);}}
async function projects(){const list=await api('projects');$('projects').replaceChildren(...list.map(p=>new Option(p.name,p.id)));if(list.length)await refresh();}
function run(fn){return async()=>{try{$('status').textContent='处理中…';await fn();$('status').textContent='完成';}catch(e){$('status').textContent=e.message;}};}
$('login').onclick=run(async()=>{resetClarification();accessToken=$('token').value;await projects();});$('projects').onchange=run(async()=>{resetClarification();await refresh();});$('create').onclick=run(async()=>{await api('projects',{name:$('projectName').value});await projects();});$('extract').onclick=run(async()=>{const result=await api(project()+'/extract',{text:$('text').value});changes=result.changes;renderDraft();$('ambiguities').textContent='待澄清：'+JSON.stringify(result.ambiguities);});$('save').onclick=run(async()=>{await api(project()+'/records',{text:$('text').value,changes,occurred_at:$('occurred').value?new Date($('occurred').value).toISOString():undefined,idempotency:key});key=crypto.randomUUID();$('text').value='';changes=[];renderDraft();await refresh();});
function resetClarification(){pendingClarification=null;$('clarify').hidden=true;$('clarifyReply').value='';}
async function submitQuestion(body){
 if(queryBusy)return;
 const path=project();queryBusy=true;$('ask').disabled=true;$('reply').disabled=true;
 try{
  const result=await api(path+'/ask',body);
  if(path!==project())return;
  $('citations').replaceChildren();resetClarification();
  if(result.status==='needs_clarification'){
   pendingClarification=result.clarification_id;$('clarify').hidden=false;
   $('answer').textContent='需要你确认一个条件，才能继续回答。';
   $('clarifyQuestion').textContent=result.clarification.question;
   $('clarifyReason').textContent=result.clarification.reason;
   $('clarifyOptions').replaceChildren();
   for(const option of result.clarification.options){const b=document.createElement('button');b.textContent=option;b.onclick=run(async()=>{await submitQuestion({clarification_id:pendingClarification,reply:option});});$('clarifyOptions').append(b);}
  }else{
   $('answer').textContent=result.answer+'\n\n'+(result.status==='insufficient'?'证据或条件不足 · ':'')+result.retrieval+' · '+result.attempts+'轮';
   for(const c of result.citations){const a=document.createElement('a');a.href='#record-'+c.id;a.textContent='来源：'+c.text.slice(0,60);$('citations').append(a,document.createElement('br'));}
  }
 }finally{queryBusy=false;$('ask').disabled=false;$('reply').disabled=false;}
}
$('ask').onclick=run(async()=>{await submitQuestion({question:$('question').value});});
$('reply').onclick=run(async()=>{if(!pendingClarification)throw Error('请重新提问');await submitQuestion({clarification_id:pendingClarification,reply:$('clarifyReply').value});});
$('cancelClarify').onclick=()=>{resetClarification();$('answer').textContent='请重新输入问题。';};
</script></html>
